<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./default.css">
    <style>
        main div {
            width: 100%;
            height: 68px;
            display: block;
            border-radius: 5px;
            border: 0;
            background-color: #ffffff20;
            padding: 8px 0;
        }

        main div a {
            font-size: 18px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            /* width: calc(100% - 210px); */
            margin-bottom: 8px;
            padding: 0 8px;
            display: block;
        }

        main div span {
            margin-left: auto;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 0 8px;
        }

        button {
            display: inline;
            width: fit-content;
            margin: 0;
        }

        label {
            border-radius: 1px;
            border-width: 1px;
            border-color: white;
            background-color: #ffffff40;
            display: inline;
        }

        date {
            width: calc(100vw - 248px - 20px + 16px);
            font-size: 15px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }

        .fts-logo {
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--md-sys-color-on-surface);
            display: flex;
            align-items: center;
            gap: 8px;
            letter-spacing: -0.5px;
            margin-right: 16px;
            flex-shrink: 0;
            text-decoration: none;
            transition: color 0.2s ease, opacity 0.2s ease;
        }

        .fts-logo img {
            width: 40px;
            height: 40px;
            object-fit: contain;
        }

        .zen-maru-gothic-light {
            font-family: "Zen Maru Gothic", sans-serif;
            font-weight: 300;
            font-style: normal;
        }

        .zen-maru-gothic-regular {
            font-family: "Zen Maru Gothic", sans-serif;
            font-weight: 400;
            font-style: normal;
        }

        .zen-maru-gothic-medium {
            font-family: "Zen Maru Gothic", sans-serif;
            font-weight: 500;
            font-style: normal;
        }

        .zen-maru-gothic-bold {
            font-family: "Zen Maru Gothic", sans-serif;
            font-weight: 700;
            font-style: normal;
        }

        .zen-maru-gothic-black {
            font-family: "Zen Maru Gothic", sans-serif;
            font-weight: 900;
            font-style: normal;
        }
        iframe {
            width: calc(100% - 4px);
            height: 100%;
        }
        main {
            padding: 0;
            height: calc(100vh - 9px);
        }
        .overlay {
            margin-top: 7vh;
            display: flex;
            z-index: 100;
            position: absolute;
            background-color: #00000050;
            border-radius: 5px;
            padding: 5px;

        }
    </style>
</head>

<body>
    <header class="nofHide">
        <div id="notification">通知バー</div>
    </header>
    <div style="margin: 0 16px; user-select: none;display: flex;justify-content: center;">
        <!-- <b style="font-size: 48px;">Mizu</b>
        <small style="font-size: 22px;">Extension</small>
        <p style="font-size: 22px; display: inline;">Metrozig</p> -->
        <div class="overlay">
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@300;400;500;700;900&display=swap"
                rel="stylesheet">
            <a href="https://flatools.com/" target="_blank" class="zen-maru-gothic-black fts-logo" style="flex-shrink: 0;">
                <img src="https://flatools.com/icon.png" alt="FlaTools Logo">
                FlaTools
            </a>
        </div>
    </div>
    <main>
        <iframe src="https://flatools.com/tools/metrozig/"></iframe>
    </main>
    <script src="./gigafile.js"></script>
</body>

</html>
