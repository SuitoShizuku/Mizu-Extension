<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="./default.css">
</head>

<body>
  <header class="nofHide">
    <div id="notification">通知バー</div>
  </header>
  <div style="margin: 0 16px; user-select: none;">
    <b style="font-size: 48px;">Mizu</b>
    <small style="font-size: 22px;">Extension</small>
    <p style="font-size: 22px; display: inline;">設定</p>
  </div>
  <main>
    <h2 style="margin-top: 0;">フル設定</h2>
    <p>ここに詳細な設定項目を配置します。</p>
    <hr>
    <h2><a href="https://youtube.com/" target="_blank">YouTube</a></h2>
    <div>
      <label class="toggle">
        <input type="checkbox" id="ytBackur">
        <span class="slider"></span>
      </label>
      背景に動画を挿入
    </div>
    <hr>
    <h2><a href="https://gigafile.nu/" target="_blank">GigaFile便</a></h2>
    <div>
      <label class="toggle">
        <input type="checkbox" id="gfFileManager" checked>
        <span class="slider"></span>
      </label>
      アップロードしたファイルをマネージャーに記録。
    </div>
    <div>
      <label class="toggle">
        <input type="checkbox" id="gfCopy" checked>
        <span class="slider"></span>
      </label>
      アップロード時にリンクのコピーボタンを付ける。
    </div>
    <div>
      <label class="toggle">
        <input type="checkbox" id="gfDelKey">
        <span class="slider"></span>
      </label>
      コピーボタンからのコピー時、削除キーも付属させる。
    </div>
    <hr>
    <button id="initializeCache">拡張機能のキャッシュ・データを削除</button>
  </main>
  <script src="./default.js"></script>
</body>

</html>
