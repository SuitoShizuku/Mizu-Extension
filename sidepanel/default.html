<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="./default.css">
</head>

<body>
  <header class="nofHide">
    <div id="notification">通知バー</div>
  </header>
  <div style="margin: 0 16px; user-select: none;">
    <b style="font-size: 48px;">Mizu</b>
    <small style="font-size: 22px;">Extension</small>
    <p style="font-size: 22px; display: inline;">設定</p>
  </div>
  <main>
    <h2 style="margin-top: 0;">フル設定</h2>
    <p>ここに詳細な設定項目を配置します。</p>
    <hr>
    <h2><a href="https://youtube.com/" target="_blank">YouTube</a></h2>
    <div>
      <label>
        <label class="toggle">
          <input type="checkbox" id="ytBackur">
          <span class="slider"></span>
        </label>
        背景に動画を挿入</label>
    </div>
    <div>
      <label class="value">
        <input type="number" id="ytBackurConfigsBlur" min="0" max="128" step="1" value="20" class="value-input">
        ぼかし量(px)
        <input type="range" id="ytBackurConfigsBlurRange" min="0" max="128" step="1" value="20" class="value-slider">
      </label>
    </div>
    <div>
      <label class="value">
        <input type="number" id="ytBackurConfigsBrightness" min="0" max="100" step="1" value="70" class="value-input">
        明度(%)
        <input type="range" id="ytBackurConfigsBrightnessRange" min="0" max="100" step="1" value="70" class="value-slider">
      </label>
    </div>
    <div>
      <label class="value">
        <input type="number" id="ytBackurConfigsOpacity" min="0" max="100" step="1" value="85" class="value-input">
        不透明度(%)
        <input type="range" id="ytBackurConfigsOpacityRange" min="0" max="100" step="1" value="85" class="value-slider">
      </label>
    </div>
    <hr>
    <h2><a href="https://gigafile.nu/" target="_blank">GigaFile便</a></h2>
    <div>
      <label>
        <label class="toggle">
          <input type="checkbox" id="gfFileManager" checked>
          <span class="slider"></span>
        </label>
        アップロードしたファイルをマネージャーに記録。</label>
    </div>
    <div>
      <label>
        <label class="toggle">
          <input type="checkbox" id="gfCopy" checked>
          <span class="slider"></span>
        </label>
        アップロード時にリンクのコピーボタンを付ける。</label>
    </div>
    <div>
      <label>
        <label class="toggle">
          <input type="checkbox" id="gfDelKey">
          <span class="slider"></span>
        </label>
        コピーボタンからのコピー時、削除キーも付属させる。</label>
    </div>
    <hr>
    <h2><a href="https://www.densuke.biz/" target="_blank">伝助</a></h2>
    <div>
      <label>
        <label class="toggle">
          <input type="checkbox" id="dsShurasuke" checked>
          <span class="slider"></span>
        </label>
        月単位の日程挿入ボタンを追加</label>
    </div>
    <hr>
    <button id="initializeCache">拡張機能のキャッシュ・データを削除</button>
  </main>
  <script src="./default.js"></script>
</body>

</html>
