<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" href="./default.css">
    <style>
        main div {
            width: 100%;
            height: 68px;
            display: block;
            border-radius: 5px;
            border: 0;
            background-color:#ffffff20;
            padding: 8px 0;
        }

        main div a {
            font-size: 18px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            /* width: calc(100% - 210px); */
            margin-bottom: 8px;
            padding: 0 8px;
            display: block;
        }

        main div span {
            margin-left: auto;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            padding: 0 8px;
        }

        button {
            display: inline;
            width: fit-content;
            margin: 0;
        }

        label {
            border-radius: 1px;
            border-width: 1px;
            border-color: white;
            background-color: #ffffff40;
            display: inline;
        }

        date {
            width: calc(100vw - 248px - 20px + 16px);
            font-size: 15px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
        }
    </style>
</head>

<body>
    <header class="nofHide">
        <div id="notification">通知バー</div>
    </header>
    <div style="margin: 0 16px; user-select: none;">
        <b style="font-size: 48px;">Mizu</b>
        <small style="font-size: 22px;">Extension</small>
        <p style="font-size: 22px; display: inline;">GigaFile</p>
    </div>
    <main id="files">
    </main>
    <script src="./gigafile.js"></script>
</body>

</html>
