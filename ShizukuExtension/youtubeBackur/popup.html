<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTubeBackur 設定</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- ADD: ポップアップコンテナ -->
  <div class="popup-container">
    <header class="header">
      <div class="title-group">
        <div class="logo-icon"></div>
        <h1 class="title">YouTubeBackur</h1>
      </div>
      <label class="switch" title="拡張機能の有効/無効">
        <input type="checkbox" id="toggle-enabled" checked>
        <span class="slider round"></span>
      </label>
    </header>

    <main class="main-content">
      <!-- ADD: ブラー量スライダー (0~128px) -->
      <div class="control-group">
        <div class="label-row">
          <span class="control-label">ブラー量</span>
          <span class="control-value" id="val-blur">40px</span>
        </div>
        <input type="range" id="input-blur" min="0" max="128" step="1" value="40" class="range-slider">
      </div>

      <!-- ADD: 明度スライダー (0~100%) -->
      <div class="control-group">
        <div class="label-row">
          <span class="control-label">明度</span>
          <span class="control-value" id="val-brightness">70%</span>
        </div>
        <input type="range" id="input-brightness" min="0" max="100" step="1" value="70" class="range-slider">
      </div>

      <!-- ADD: 不透明度スライダー (0~100%) -->
      <div class="control-group">
        <div class="label-row">
          <span class="control-label">不透明度</span>
          <span class="control-value" id="val-opacity">85%</span>
        </div>
        <input type="range" id="input-opacity" min="0" max="100" step="1" value="85" class="range-slider">
      </div>

      <!-- ADD: フッター・操作ボタン -->
      <div class="footer-actions">
        <button id="btn-reset" class="btn-reset" type="button">初期値に戻す</button>
      </div>
    </main>
  </div>

  <script src="popup.js"></script>
</body>
</html>
