<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 0;
      color: #fff;
      background-color: #000e1c;
    }

    header {
      background-color: #fe3030;
      font-size: 15px;
      margin: 0;
      z-index: 1000;
      position: fixed;
      width: 100%;
      transition: opacity 0.5s ease;
    }
    header.nofHide {
      opacity: 0;
      pointer-events: none;
    }
    header.nofShow {
      opacity: 1;
      pointer-events: auto;
    }
    #notification {
      /* margin: 16px; */
      padding: 8px 16px;
    }

    main {
      padding: 16px;
    }
    
    button {
      margin-top: 16px;
      width: 100%;
      padding: 8px;
      cursor: pointer;
      background-color: #ffffff30;
      border-width: 0;
      border-radius: 5px;
      color: #fff;
      font-weight: bold;
      user-select: none;
    }
  </style>
</head>

<body>
  <header class="nofHide">
    <div id="notification">通知バー</div>
  </header>
  <div style="margin: 0 16px; user-select: none;">
    <b style="font-size: 48px;">Mizu</b>
    <small style="font-size: 22px;">Extension</small>
    <p style="font-size: 22px; display: inline;">設定</p>
  </div>
  <main>
    <h2 style="margin-top: 0;">フル設定</h2>
    <p>ここに詳細な設定項目を配置します。</p>
    <hr>
    <button id="initializeCache">拡張機能のキャッシュ・データを削除</button>
  </main>
  <script src="sidepanel.js"></script>
</body>

</html>
